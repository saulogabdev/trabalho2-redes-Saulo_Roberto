services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle_app
    restart: always
    ports:
      - "${DOZZLE_PORT}:8080"
    environment:
      DOZZLE_LEVEL: ${DOZZLE_LEVEL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data

volumes:
  dozzle_data: